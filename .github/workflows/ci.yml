name: Deno Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format-lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: jdx/mise-action@v4
      - name: Run fmt
        run: deno fmt --check
      - name: Run lint
        run: deno lint
      - name: Run Type Check
        run: deno check
  update-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Check License Lines
        uses: kt3k/license_checker@v1.0.6
      - uses: jdx/mise-action@v4
      - name: Run xml check
        run: |
          deno task create
          git add *.xml && git diff --cached --exit-code
